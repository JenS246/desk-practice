<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <meta name="description" content="A quiet legal-office typing practice game for paralegal students." />
    <meta name="theme-color" content="#d8d0c2" />
    <title>Desk Practice | Legal Internship Typing Practice</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=mobile-desk-1" />
  </head>
  <body>
    <main class="desk">
      <div class="desk-grain" aria-hidden="true"></div>

      <section class="home-screen" data-screen="home">
        <div class="folder" aria-hidden="true"></div>
        <div class="home-paper">
          <span class="desk-fragment folder-fragment" aria-hidden="true"></span>
          <span class="desk-fragment pad-fragment" aria-hidden="true"></span>
          <span class="desk-fragment clip-fragment" aria-hidden="true"></span>
        <article class="paper cover-sheet">
          <div class="cover-copy">
            <h1>Desk Practice</h1>
            <p class="course-name">Legal Internship Typing Practice</p>
            <p class="instruction">Type the document exactly as it appears.</p>
            <fieldset class="practice-options">
              <legend class="sr-status">Practice</legend>
              <label><input type="radio" name="practice-duration" value="0" checked /> Full document</label>
              <label><input type="radio" name="practice-duration" value="30000" /> 30 seconds</label>
              <label><input type="radio" name="practice-duration" value="60000" /> 60 seconds</label>
              <label><input type="radio" name="practice-duration" value="120000" /> 2 minutes</label>
            </fieldset>
            <button class="start-button" type="button" data-start>Start</button>
          </div>
        </article>
        </div>
      </section>

      <section class="practice-screen" data-screen="practice" hidden>
        <div class="folder practice-folder" aria-hidden="true"></div>
        <div class="paper-stack">
          <span class="desk-fragment folder-fragment" aria-hidden="true"></span>
          <span class="desk-fragment pad-fragment" aria-hidden="true"></span>
          <article class="paper source-sheet" aria-labelledby="document-type">
            <header class="document-heading">
              <h1 id="document-type" data-document-type></h1>
            </header>
            <p class="source-text" data-source-text aria-label="Text to type"></p>
            <p class="source-line" data-source hidden></p>
          </article>

          <article class="paper typing-sheet" data-typing-sheet>
            <label for="typing-input">Begin typing below.</label>
            <div class="typing-field">
              <textarea id="typing-input" data-input rows="6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
            </div>
            <div class="pause-notice" data-pause-notice hidden>
              <strong>Paused</strong>
              <button type="button" data-resume>Resume</button>
            </div>
            <div class="document-confirm" data-confirm hidden>
              <p data-confirm-message>Start a different document? Your current attempt will be cleared.</p>
              <div>
                <button type="button" data-cancel-new>Cancel</button>
                <button type="button" data-confirm-new>New document</button>
              </div>
            </div>
            <footer class="attempt-controls" data-attempt-controls>
              <p><span data-time-label>Time</span> <time datetime="PT0S" data-time>0:00</time></p>
              <div>
                <button type="button" data-pause>Pause</button>
                <button type="button" data-restart>Restart</button>
                <button type="button" data-new>New document</button>
                <button type="button" data-home>Home</button>
              </div>
            </footer>
            <p class="sr-status" data-status aria-live="polite"></p>
          </article>
        </div>

        <aside class="result-slip" data-results hidden aria-labelledby="results-title">
          <h2 id="results-title">Completed</h2>
          <dl>
            <div><dt>WPM</dt><dd data-wpm>0</dd></div>
            <div><dt>Accuracy</dt><dd data-accuracy>0%</dd></div>
            <div><dt>Errors</dt><dd data-errors>0</dd></div>
            <div><dt>Time</dt><dd data-result-time>0:00</dd></div>
          </dl>
          <p class="result-source" data-result-source hidden></p>
          <div class="result-actions">
            <button type="button" data-next>Next document</button>
            <button type="button" class="plain-button" data-retry>Try again</button>
            <button type="button" class="home-action" data-home>Home</button>
          </div>
        </aside>
      </section>
    </main>

    <script src="passages.js"></script>
    <script src="typing-engine.js?v=timed-practice-1"></script>
    <script src="app.js?v=home-1"></script>
  </body>
</html>
